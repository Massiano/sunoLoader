<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Suno Universal Inspector</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; color: #333; max-width: 950px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input[type="text"] { width: 65%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; margin-bottom: 5px; }
        button:hover { background: #0051a2; }
        pre { background: #1e1e1e; color: #dcdcdc; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 300px; }
        .download-btn { background: #10b981; }
        .download-btn:hover { background: #059669; }
        .dual-container { display: flex; gap: 15px; flex-wrap: wrap; }
        .dual-column { flex: 1; min-width: 300px; background: #fafafa; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Suno Universal Inspector</h2>
        <p>Classifies the URL, executes song or playlist parsing using both HTML and RSC methods, and displays both results:</p>
        <div style="display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
            <input type="text" id="urlInput" placeholder="https://suno.com/song/... or playlist/..." />
            <button onclick="fetchComprehensive()">Fetch All 3 Data Streams</button>
            <button onclick="getSunoInfo()" style="background: #ec4899;">Get Suno Info</button>
        </div>
        <div id="result"></div>
    </div>
    <script>
        let currentData = null;

        async function fetchComprehensive() {
            const url = document.getElementById("urlInput").value;
            const resDiv = document.getElementById("result");
            if (!url) return alert("Please enter a URL");
            resDiv.innerHTML = "<p>Fetching and extracting HTML Header, DOM, and RSC Payload...</p>";
            try {
                const resp = await window.fetch("/api/parse-comprehensive", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
                currentData = await resp.json();
                if (!resp.ok) throw new Error(currentData.error || "Failed");

                resDiv.innerHTML = `
                    <h3>Results for (${currentData.page_type}):</h3>
                    <div>
                        <button class="download-btn" onclick="downloadJSON('html_header')">Download HTML Header JSON</button>
                        <button class="download-btn" onclick="downloadDOM()">Download HTML DOM String (.html)</button>
                        <button class="download-btn" onclick="downloadJSON('rsc_payload')">Download RSC Payload JSON</button>
                    </div>
                    <h4>HTML Header:</h4><pre>${JSON.stringify(currentData.html_header, null, 2)}</pre>
                    <h4>HTML DOM Preview (First 500 chars):</h4><pre>${escapeHtml(currentData.html_dom.substring(0, 500))}...</pre>
                    <h4>RSC Payload Preview:</h4><pre>${JSON.stringify(currentData.rsc_payload, null, 2)}</pre>
                `;
            } catch (err) { resDiv.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`; }
        }

        async function getSunoInfo() {
            const url = document.getElementById("urlInput").value;
            const resDiv = document.getElementById("result");
            if (!url) return alert("Please enter a URL");
            resDiv.innerHTML = "<p>Classifying URL and executing dual-stream parsing...</p>";
            try {
                const resp = await window.fetch("/api/get-suno-info", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
                const json = await resp.json();
                if (!resp.ok) throw new Error(json.message || "Failed");

                resDiv.innerHTML = `
                    <h3>Suno Info Results:</h3>
                    <p><strong>Page Type:</strong> ${json.page_type}</p>
                    <p><strong>Resolved URL:</strong> ${json.resolved_url}</p>
                    <div class="dual-container">
                        <div class="dual-column">
                            <h4>HTML Parser Result</h4>
                            <pre>${JSON.stringify(json.html_parser_result, null, 2)}</pre>
                        </div>
                        <div class="dual-column">
                            <h4>RSC Parser Result</h4>
                            <pre>${JSON.stringify(json.rsc_parser_result, null, 2)}</pre>
                        </div>
                    </div>
                `;
            } catch (err) { resDiv.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`; }
        }

        function downloadJSON(type) {
            if (!currentData || !currentData[type]) return alert("No data available to download");
            const blob = new Blob([JSON.stringify(currentData[type], null, 2)], { type: "application/json" });
            triggerDownload(blob, `suno_${currentData.page_type}_${type}.json`);
        }

        function downloadDOM() {
            if (!currentData || !currentData.html_dom) return alert("No DOM data available to download");
            const blob = new Blob([currentData.html_dom], { type: "text/html" });
            triggerDownload(blob, `suno_${currentData.page_type}_dom.html`);
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
